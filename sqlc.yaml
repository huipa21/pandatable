version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations
      - internal/auth/catalog.sql
    queries: internal/auth/queries.sql
    gen:
      go:
        package: authsql
        out: internal/auth/authsql
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema:
      - migrations
    queries: internal/acl/queries.sql
    gen:
      go:
        package: aclsql
        out: internal/acl/aclsql
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema:
      - migrations
      - internal/structure/catalog.sql
    queries: internal/structure/queries.sql
    gen:
      go:
        package: structuresql
        out: internal/structure/structuresql
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema:
      - migrations
      - internal/admin/catalog.sql
    queries: internal/admin/queries.sql
    gen:
      go:
        package: adminsql
        out: internal/admin/adminsql
        sql_package: pgx/v5
        omit_unused_structs: true
